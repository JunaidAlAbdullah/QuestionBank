<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Questions — Question Bank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-navbar"></header>

  <main>
    <div class="container">
      <h1>Browse Questions</h1>

      <form id="search-form" class="search-bar" role="search">
        <input type="search" id="search-input" placeholder="Search by course, faculty, or question…" aria-label="Search">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <form id="filter-form" class="filter-bar">
        <div class="field">
          <label for="filter-course">Course</label>
          <input type="text" id="filter-course" placeholder="e.g. CSE325">
        </div>
        <div class="field">
          <label for="filter-faculty">Faculty</label>
          <input type="text" id="filter-faculty" placeholder="e.g. Dr. Rahman">
        </div>
        <div class="field">
          <label for="filter-department">Department</label>
          <select id="filter-department"><option value="">All departments</option></select>
        </div>
        <div class="field">
          <label for="filter-semester">Semester</label>
          <select id="filter-semester">
            <option value="">All semesters</option>
            <option value="Spring">Spring</option>
            <option value="Summer">Summer</option>
            <option value="Fall">Fall</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-year">Year</label>
          <input type="number" id="filter-year" placeholder="e.g. 2026">
        </div>
        <div class="field">
          <label for="filter-exam">Exam Type</label>
          <select id="filter-exam"><option value="">All types</option></select>
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary btn-sm">Apply</button>
          <button type="button" id="clear-filters" class="btn btn-sm">Clear filters</button>
        </div>
      </form>

      <div class="sort-row">
        <span id="result-count">Loading…</span>
        <label class="mb-0" style="display:flex;align-items:center;gap:8px;font-size:13px;">
          Sort by
          <select id="sort-select">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="most_viewed">Most viewed</option>
            <option value="most_downloaded">Most downloaded</option>
          </select>
        </label>
      </div>

      <div id="question-list"></div>
      <div id="pagination-mount"></div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/browse.js"></script>
</body>
</html>
