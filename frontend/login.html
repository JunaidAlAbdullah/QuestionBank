<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Question Bank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-navbar"></header>

  <main>
    <div class="auth-shell">
      <form id="login-form" class="form-card" style="width:100%;max-width:400px;" novalidate>
        <h1>Log in</h1>
        <p class="text-muted">Welcome back to Question Bank.</p>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <div class="field-error hidden" id="form-error"></div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
        <p class="text-muted" style="margin-top:16px;text-align:center;">
          Don't have an account? <a href="register.html">Register</a>
        </p>
      </form>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
